appId: com.companyname.andriodapp1
env:
  TO_NIGHT: 'false'
---
- tapOn:
    id: action_shell_menu
- tapOn:
    text: "Settings"
- scrollUntilVisible:
    element:
      id: 'nightModeSpinner'
    direction: DOWN
- tapOn:
    id: nightModeSpinner
# Label selectors, not list indexes (Follow system / Always light / Always dark).
- runFlow:
    when:
      true: ${TO_NIGHT == 'true'}
    commands:
      - tapOn:
          text: "Always dark"
- runFlow:
    when:
      true: ${TO_NIGHT == 'false'}
    commands:
      - tapOn:
          text: "Always light"
- back
