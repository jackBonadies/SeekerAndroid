appId: com.companyname.andriodapp1
env:
  IS_NIGHT: 'true'
---
- tapOn:
    id: action_shell_menu
- tapOn:
    text: "Settings"
- scrollUntilVisible:
    element:
      id: 'nightVarientSpinner'
    direction: DOWN
# Select by label instead of a list index: the variant lists start with Modern
# since Phase 2A, so positional selectors are no longer valid.
- runFlow:
    when:
      true: ${IS_NIGHT == 'true'}
    commands:
      - tapOn:
          id: nightVarientSpinner
      - tapOn:
          text: "Modern"
- runFlow:
    when:
      true: ${IS_NIGHT == 'false'}
    commands:
      - tapOn:
          id: dayVarientSpinner
      - tapOn:
          text: "Modern"
- runFlow: ./back_to_main.yaml
