name: Build IzzySoft Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Attach APK to a GitHub release (tag name, blank to skip)'
        required: false
        default: ''

jobs:
  build:
    name: Build Release IzzySoft on Ubuntu
    runs-on: ubuntu-latest
    environment: release-signing

    permissions:
      contents: write

    env:
      CONFIGURATION: 'Release IzzySoft'
      # Deterministic build helpers (best-effort — full byte-for-byte reproducibility
      # still requires audit of trimmer/AOT output and APK packaging order).
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so we can derive SOURCE_DATE_EPOCH from the tag commit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET (honors global.json -> 9.0.201)
        uses: actions/setup-dotnet@v4

      - name: Install android workload
        run: dotnet workload install android

      - name: Derive SOURCE_DATE_EPOCH from HEAD commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Seeker/Seeker.csproj

      - name: Derive VERSION from tag
        run: |
          RAW="${{ github.event_name == 'workflow_dispatch' && inputs.attach_to_release || github.ref_name }}"
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"

      - name: Build all-ABI release APKs
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./Misc/package-release.ps1 -Version "$env:VERSION"

      - name: List release APKs
        run: ls -lh release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seeker-izzysoft-apks
          path: release-apks/seeker*.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.attach_to_release != '')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_to_release || github.ref_name }}
          files: release-apks/seeker*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: "true"

      - name: Build Play Store AAB (Release)
        env:
          AndroidSigningKeyStore: ${{ env.KEYSTORE_PATH }}
          AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish Seeker/Seeker.csproj \
            -c Release \
            -f net9.0-android \
            -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
            -p:AndroidSigningKeyAlias="$AndroidSigningKeyAlias" \
            -p:AndroidSigningKeyPass="$AndroidSigningKeyPass" \
            -p:AndroidSigningStorePass="$AndroidSigningStorePass" \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -p:SourceRevisionId=${{ github.sha }}

      - name: Stage AAB for upload
        run: |
          AAB=$(find Seeker/bin/Release/net9.0-android -name "*-Signed.aab" -type f 2>/dev/null | head -n1)
          if [ -z "$AAB" ]; then
            echo "::error::No signed AAB found under Seeker/bin/Release/net9.0-android"
            find Seeker/bin/Release -name "*.aab" -type f || true
            exit 1
          fi
          mkdir -p release-aab
          cp "$AAB" "release-aab/seeker${VERSION}.aab"
          ls -lh release-aab/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeker-playstore-aab
          path: release-aab/seeker*.aab
          if-no-files-found: error
